<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Indicadores de Acompañamiento Familiar</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    body {
      font-family: sans-serif;
      margin: 2rem;
      background-color: #f8f9fa;
    }
    h1 {
      color: #2e7d32;
    }
    .indicador {
      background-color: white;
      border-radius: 12px;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
      padding: 1rem;
      margin-bottom: 1rem;
    }
    .indicador h3 {
      margin-top: 0;
      color: #333;
    }
    .estado {
      font-weight: bold;
      font-size: 1.1rem;
    }
    .verde { color: green; }
    .amarillo { color: goldenrod; }
    .rojo { color: red; }
  </style>
</head>
<body>
  <h1>Indicadores de Acompañamiento Familiar</h1>

  <div class="indicador">
    <h3>Ingresos esta semana</h3>
    <p class="estado verde">3 de 5 días &mdash; Bien</p>
  </div>

  <div class="indicador">
    <h3>Revisión de Bitácora Emocional</h3>
    <p class="estado rojo">No realizada esta semana</p>
  </div>

  <div class="indicador">
    <h3>Visualización de tareas</h3>
    <p class="estado amarillo">1 de 3 tareas vistas</p>
  </div>

  <div class="indicador">
    <h3>Comentarios enviados a docentes</h3>
    <p class="estado verde">2 mensajes esta semana</p>
  </div>

  <div class="indicador">
    <h3>Asistencia a reuniones</h3>
    <p class="estado rojo">Ninguna registrada este mes</p>
  </div>

</body>
</html>
