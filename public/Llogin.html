<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Login - Colegio Q'nil</title>
</head>
<body>
    <h2>Iniciar Sesión</h2>
    <input type="email" id="email" placeholder="Correo"><br><br>
    <input type="password" id="password" placeholder="Contraseña"><br><br>
    <button id="loginBtn">Iniciar Sesión</button>
    <button id="registerBtn">Registrarse</button>

    <!-- Firebase SDK compat -->
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-check-compat.js"></script>
    <script>
        // Configuración correcta de Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyDExIysAk3D-cdMaSKatJwAhPfAeTLd-nc",
            authDomain: "proyectoq-68c43.firebaseapp.com",
            projectId: "proyectoq-68c43",
            storageBucket: "proyectoq-68c43.firebasestorage.app",
            messagingSenderId: "943912549434",
            appId: "1:943912549434:web:8571268d93ce7f20784903"
        };

        // Inicializar Firebase
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
// Activar App Check con reCAPTCHA v3
  const appCheck = firebase.appCheck();
  appCheck.activate("6LcXGUoqAAAAAOXhmyIhiLPelg-D6DrPhnHI0JQd", true); 
  // ⚠️ Reemplazar SITE_KEY_RECAPTCHA con la clave del paso 1
</script>
<script>
        // Botón de login
        document.getElementById("loginBtn").addEventListener("click", () => {
            const email = document.getElementById("email").value.trim();
            const pass = document.getElementById("password").value.trim();

            auth.signInWithEmailAndPassword(email, pass)
                .then((userCredential) => {
                    alert("✅ Sesión iniciada correctamente");
                    window.location.href = "index.html";
                })
                .catch((error) => {
                    alert("❌ Error: " + error.message);
                });
        });

        // Botón de registro
        document.getElementById("registerBtn").addEventListener("click", () => {
            const email = document.getElementById("email").value.trim();
            const pass = document.getElementById("password").value.trim();

            auth.createUserWithEmailAndPassword(email, pass)
                .then((userCredential) => {
                    alert("✅ Usuario registrado correctamente");
                })
                .catch((error) => {
                    alert("❌ Error: " + error.message);
                });
        });
	</script>
    </script>
</body>
</html>
