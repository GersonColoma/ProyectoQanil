<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio de Sesión OTP</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-container {
            background-color: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            width: 300px;
            text-align: center;
        }
        h2 {
            margin-bottom: 20px;
            color: #333;
        }
        input[type="text"], input[type="password"] {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        button {
            background-color: #28a745;
            color: white;
            padding: 10px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
        }
        button:hover {
            background-color: #218838;
        }
        .error {
            color: red;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="login-container">
        <h2>Inicio de Sesión</h2>
        <form id="otpForm">
            <input type="text" id="phoneNumber" placeholder="Número de teléfono (+502)" required>
            <button type="button" onclick="sendOTP()">Enviar OTP</button>

            <div id="otpSection" style="display:none;">
                <input type="password" id="otpCode" placeholder="Ingrese el OTP" required>
                <button type="submit">Verificar OTP</button>
            </div>
        </form>
        <p class="error" id="errorMsg"></p>
    </div>

    <script>

        function sendOTP() {
            const phoneNumber = document.getElementById('phoneNumber').value;
            const errorMsg = document.getElementById('errorMsg');

            // Validación básica para el formato de número de teléfono de Guatemala
            const guatemalaPhoneRegex = /^(\+502)?\d{8}$/;

            if (!guatemalaPhoneRegex.test(phoneNumber)) {
                errorMsg.textContent = 'Por favor, ingresa un número de teléfono válido de Guatemala.';
                return;
            }

            // Aquí enviarías el OTP al número de teléfono

            // Por ejemplo, usando un servicio como Twilio o una API personalizada.
            console.log('OTP enviado a ' + phoneNumber);

            // Mostrar la sección de OTP
            document.getElementById('otpSection').style.display = 'block';
            errorMsg.textContent = '';
        }

        document.getElementById('otpForm').addEventListener('submit', function(event) {
            event.preventDefault();
            const otpCode = document.getElementById('otpCode').value;
            
            // Aquí validarías el OTP que se ingresó
            if (otpCode === '123456') { // Simulando un OTP válido
                alert('Inicio de sesión exitoso');
                // Redirigir o realizar alguna acción después de la verificación exitosa
            } else {
                document.getElementById('errorMsg').textContent = 'OTP incorrecto, por favor intente de nuevo.';
            }
        });
    </script>

</body>
</html>
