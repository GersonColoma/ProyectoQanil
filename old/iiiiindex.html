<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio de Sesión con Firebase</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-container {
            background-color: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            width: 300px;
            text-align: center;
        }
        h2 {
            margin-bottom: 20px;
            color: #333;
        }
        input[type="text"], input[type="password"] {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        button {
            background-color: #28a745;
            color: white;
            padding: 10px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
            margin-bottom: 10px;
        }
        button:hover {
            background-color: #218838;
        }
        .error {
            color: red;
            margin-top: 10px;
        }
        .divider {
            margin: 20px 0;
            text-align: center;
            border-bottom: 1px solid #ccc;
            line-height: 0.1em;
            margin-bottom: 20px;
        }
        .divider span {
            background: #f4f4f9;
            padding: 0 10px;
        }
    </style>
    <!-- Incluye Firebase SDK -->
    <script type="module">
        // Importa las APIs de Firebase que necesitas desde el SDK modular
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.21.0/firebase-app.js";
        import { getAuth, signInWithPhoneNumber, signInWithEmailAndPassword, GoogleAuthProvider, signInWithPopup, RecaptchaVerifier } from "https://www.gstatic.com/firebasejs/9.21.0/firebase-auth.js";

        // Configuración de Firebase para tu proyecto
const firebaseConfig = {

  apiKey: "AIzaSyDExIysAk3D-cdMaSKatJwAhPfAeTLd-nc",

  authDomain: "proyectoq-68c43.firebaseapp.com",

  projectId: "proyectoq-68c43",

  storageBucket: "proyectoq-68c43.appspot.com",

  messagingSenderId: "943912549434",

  appId: "1:943912549434:web:8571268d93ce7f20784903"

};



        //const firebaseConfig = {
          //  apiKey: "TU_API_KEY",
          //  authDomain: "TU_PROYECTO.firebaseapp.com",
          //  projectId: "TU_PROJECT_ID",
          //  storageBucket: "TU_STORAGE_BUCKET",
          //  messagingSenderId: "TU_MESSAGING_SENDER_ID",
          //  appId: "TU_APP_ID",
          //  measurementId: "TU_MEASUREMENT_ID"
       // };

        // Inicializa Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const googleProvider = new GoogleAuthProvider();

        // Configura el reCAPTCHA
        window.recaptchaVerifier = new RecaptchaVerifier('recaptcha-container', {
            'size': 'invisible',
            'callback': function(response) {
                sendOTP();
            }
        }, auth);

        // Define la función sendOTP globalmente
        window.sendOTP = function() {
            const phoneNumber = document.getElementById('phoneNumber').value;
            const errorMsg = document.getElementById('errorMsg');

            // Validación básica para el formato de número de teléfono de Guatemala
            const guatemalaPhoneRegex = /^(\+502)?\d{8}$/;

            if (!guatemalaPhoneRegex.test(phoneNumber)) {
                errorMsg.textContent = 'Por favor, ingresa un número de teléfono válido de Guatemala.';
                return;
            }

            const appVerifier = window.recaptchaVerifier;

            // Enviar el OTP utilizando Firebase
            signInWithPhoneNumber(auth, phoneNumber, appVerifier)
                .then((confirmationResult) => {
                    // SMS enviado
                    window.confirmationResult = confirmationResult;
                    document.getElementById('otpSection').style.display = 'block';
                    errorMsg.textContent = '';
                }).catch((error) => {
                    errorMsg.textContent = 'Error al enviar OTP: ' + error.message;
                });
        };

        // Define la función verifyOTP globalmente
        window.verifyOTP = function() {
            const otpCode = document.getElementById('otpCode').value;
            const errorMsg = document.getElementById('errorMsg');

            // Verificar el OTP
            window.confirmationResult.confirm(otpCode).then((result) => {
                // Usuario autenticado correctamente
                const user = result.user;
                alert('Inicio de sesión exitoso');
		window. location. href = "./home.html";
            }).catch((error) => {
                errorMsg.textContent = 'OTP incorrecto, por favor intente de nuevo.';
            });
        };

        // Función para iniciar sesión con correo electrónico y contraseña
        window.emailSignIn = function() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorMsg = document.getElementById('errorMsg');

            signInWithEmailAndPassword(auth, email, password)
                .then((userCredential) => {
                    alert('Inicio de sesión exitoso con correo electrónico');
                })
                .catch((error) => {
                    errorMsg.textContent = 'Error: ' + error.message;
                });
        };

        // Función para iniciar sesión con Google
        window.googleSignIn = function() {
            signInWithPopup(auth, googleProvider)
                .then((result) => {
                    const user = result.user;
                    alert('Inicio de sesión exitoso con Google');
                })
                .catch((error) => {
                    const errorMsg = document.getElementById('errorMsg');
                    errorMsg.textContent = 'Error: ' + error.message;
                });
        };
    </script>
</head>
<body>

    <div class="login-container">
        <h2>Inicio de Sesión</h2>

        <!-- Inicio de sesión con número de teléfono (OTP) -->
        <div id="recaptcha-container"></div>
        <form id="otpForm">
            <input type="text" id="phoneNumber" placeholder="Número de teléfono (+502)" required>
            <button type="button" onclick="sendOTP()">Enviar OTP</button>

            <div id="otpSection" style="display:none;">
                <input type="password" id="otpCode" placeholder="Ingrese el OTP" required>
                <button type="button" onclick="verifyOTP()">Verificar OTP</button>
            </div>
        </form>

        <div class="divider"><span>o</span></div>

        <!-- Inicio de sesión con correo electrónico -->
        <form id="emailForm">
            <input type="text" id="email" placeholder="Correo electrónico" required>
            <input type="password" id="password" placeholder="Contraseña" required>
            <button type="button" onclick="emailSignIn()">Iniciar sesión con Correo</button>
        </form>

        <div class="divider"><span>o</span></div>

        <!-- Inicio de sesión con Google -->
        <button type="button" onclick="googleSignIn()">Iniciar sesión con Google</button>

        <p class="error" id="errorMsg"></p>
    </div>

</body>
</html>
